<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login — Bellora BD</title>
  <link rel="icon" href="/images/bellora-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/bellora-icon.png">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <main id="main-content" class="login-card">
    <a class="wordmark" href="/" aria-label="Bellora home"><img src="/images/bellora-logo.png" alt="Bellora" width="900" height="272"></a>
    <p class="admin-kicker">Staff only</p>
    <h1>Admin login</h1>
    {{ERROR}}
    <form method="POST" action="/admin/login">
      <label>Username<input name="username" required autofocus></label>
      <label>Password<input type="password" name="password" required></label>
      <button class="btn full" type="submit">Login</button>
    </form>
  </main>
</body>
</html>
